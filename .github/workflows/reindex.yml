name: Reindex KB

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar ingestão
        run: python ingest.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
